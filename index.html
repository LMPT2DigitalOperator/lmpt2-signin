<html lang="th">
<head>
<title>ลงชื่อเข้าประชุม · LMPT2</title>
<meta name="theme-color" content="#0b2545">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230b2545%27/%3E%3Cpath d=%27M9 16.5l4.5 4.5L23 11%27 stroke=%27%230e95a3%27 stroke-width=%273.5%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0b2545;--navy2:#13315c;--teal:#0e95a3;--teal-soft:#dff3f5;--page:#e8eff6;--card:#fff;--ink:#13243b;--ink2:#3d4d66;--mute:#66758c;--line:#d3dde9;--bad:#c2402f}
  html[data-theme="dark"]{--page:#0a1424;--card:#111f35;--ink:#e3ebf5;--ink2:#b7c5d8;--mute:#8496ae;--line:#22385a;--teal-soft:#0f3340;color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--page);color:var(--ink);font:16px/1.45 "Noto Sans Thai","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  .top{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:18px 20px 64px;border-radius:0 0 28px 28px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{background:#fff;border-radius:10px;padding:6px 10px;display:inline-flex}.logo svg{height:26px;width:auto;display:block}
  .brand small{font-size:12px;letter-spacing:.1em;opacity:.75}
  .top h1{margin:18px 0 0;font-size:28px;font-weight:700}
  .top .date{font-size:15px;opacity:.85}
  .wrap{max-width:540px;margin:-44px auto 0;padding:0 14px 32px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 28px rgba(11,37,69,.10);padding:20px 18px 22px}
  .q{animation:qin .18s ease-out}@keyframes qin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .q+.q{margin-top:20px}
  .ql{display:block;font-size:14px;font-weight:700;color:var(--ink2);margin:0 0 8px}
  .ql i{font-style:normal;color:var(--bad);margin-left:3px}
  input[type=text],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;font-size:17px;color:var(--ink);background:var(--card);outline:none;appearance:none}
  input[type=text],select{height:52px}
  textarea{min-height:96px;padding:12px 14px;resize:vertical}
  select{padding-right:40px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 22px) 23px,calc(100% - 16px) 23px;background-size:6px 6px;background-repeat:no-repeat}
  input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips.wide{flex-direction:column}
  .chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 15px;font:inherit;font-size:16px;cursor:pointer;text-align:left}
  .chips:not(.wide) .chip{border-radius:999px}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  html[data-theme="dark"] .chip.on{background:var(--teal);border-color:var(--teal);color:#04141a}
  /* Day / Night switch, as in IOMS */
  .brand .sp{flex:1}
  .theme{display:inline-flex;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px;gap:2px}
  .theme button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:rgba(255,255,255,.8);font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer}
  .theme button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .theme button.on{background:#fff;color:var(--navy)}
  html[data-theme="dark"] .theme button.on{background:var(--teal);color:#04141a}
  @media (max-width:440px){.brand small{display:none}.logo svg{height:22px}.theme button{padding:5px 9px;font-size:12px}}
  .check{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:17px}
  .check input{width:24px;height:24px;accent-color:var(--teal);margin:0}
  .check.on{border-color:var(--teal);background:var(--teal-soft)}
  .bad .ql{color:var(--bad)}.bad input[type=text],.bad select,.bad .check{border-color:var(--bad)}
  .go{margin-top:26px;width:100%;height:56px;border:0;border-radius:16px;background:var(--teal);color:#fff;font:inherit;font-size:19px;font-weight:700;cursor:pointer}
  .go:disabled{opacity:.55}
  .err{color:var(--bad);font-size:15px;margin-top:12px;text-align:center}
  .done{text-align:center;padding:12px 4px 4px}
  .tick{width:84px;height:84px;border-radius:50%;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;margin:4px auto 14px}
  .tick svg{width:44px;height:44px;stroke:var(--teal);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .done h2{margin:0 0 4px;font-size:24px}.done p{margin:0;color:var(--ink2)}
  .num{display:inline-block;margin-top:14px;background:var(--page);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink2)}.num b{color:var(--ink);font-size:16px}
  .who{margin-top:18px;text-align:left;border-top:1px solid var(--line);padding-top:12px}
  .who h3{margin:0 0 6px;font-size:14px;color:var(--ink2)}
  .who ol{margin:0;padding-left:26px;font-size:15px}.who li{padding:2px 0}
  .again{margin-top:18px;background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:12px;height:46px;padding:0 18px;font:inherit;cursor:pointer}
  .keep{margin-top:16px;text-align:left;background:var(--teal-soft);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink)}.keep b:first-child{display:block;margin-bottom:2px}
  .loading{text-align:center;color:var(--mute);padding:24px 0}
  .foot{text-align:center;color:var(--mute);font-size:12px;margin-top:16px}
  [hidden]{display:none!important}
</style>
</head>

  })();
  /* ===== the one setting: the Apps Script web app address (Deploy > Manage deployments > Web app URL, ends in /exec) ===== */
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbygRVW4ZbWnsieEQnpM2FXoUu7F-P2E7SkQgf3nFI0f6FFZLXtnn35pLcmf011POhtwrQ/exec';

  /* the form (questions, choices, staff names, today's date) comes from the Apps Script; the last copy is kept on this
     phone so the page opens at once, and is refreshed every visit */
  var CFGKEY = 'lmpt2.signin.cfg', started = false, cached = null;
  try { cached = JSON.parse(localStorage.getItem(CFGKEY) || 'null'); } catch (e) {}
  function plantToday() { var d = new Date(Date.now() + 7 * 3600e3); return d.toISOString().slice(0, 10); }
  if (cached && cached.fields) { cached.today = plantToday(); start(cached); }
  if (!/\/exec(\?|$)/.test(GAS_URL)) document.getElementById('qs').innerHTML = '<div class="loading">ยังไม่ได้ตั้ง GAS_URL ใน index.html</div>';
  else fetch(GAS_URL + '?api=config', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (c) {
    if (!c || !c.fields) throw new Error('bad config');
    var old = cached && JSON.stringify({ f: cached.fields, s: cached.staff, t: cached.title });
    try { localStorage.setItem(CFGKEY, JSON.stringify(c)); } catch (e) {}
    if (!started) start(c);
    else if (old !== JSON.stringify({ f: c.fields, s: c.staff, t: c.title })) location.reload();   /* the form was changed */
  }).catch(function () { if (!started) document.getElementById('qs').innerHTML = '<div class="loading">เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่</div>'; });

  function post(data) {   /* text/plain: a "simple" request, so the browser sends it to Google without an extra check */
    return fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'signin', data: data }) }).then(function (r) { return r.json(); });
  }

  function start(CFG) {
  started = true;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var D = new Date(CFG.today + 'T00:00:00'), dateText = D.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  $('ttl').textContent = CFG.title; $('sub').textContent = CFG.subtitle; $('dt').textContent = dateText;
  $('staff').innerHTML = (CFG.staff || []).map(function (n) { return '<option value="' + esc(n) + '">'; }).join('');
  var KEEP = 'lmpt2.signin.v2', V = {};      /* answers; name and who-you-are are remembered on this phone */
  var NOKEEP = { meeting: 1, handover: 1, certify: 1, followup: 1 };
  try { V = JSON.parse(localStorage.getItem(KEEP) || '{}') || {}; } catch (e) { V = {}; }
  Object.keys(NOKEEP).forEach(function (k) { delete V[k]; });
  try { var qp = new URLSearchParams(location.search); CFG.fields.forEach(function (f) { if (qp.get(f.key) && !NOKEEP[f.key]) V[f.key] = qp.get(f.key); }); } catch (e) {}   /* an old personal link still works */

  /* every question once; showIf decides which are on screen (same rule as the server) */
  $('qs').innerHTML = CFG.fields.map(function (f) {
    var lab = '<label class="ql">' + esc(f.label) + (f.required ? '<i>*</i>' : '') + '</label>', body;
    if (f.type === 'chips') body = '<div class="chips' + (f.wide ? ' wide' : '') + '">' + f.options.map(function (o) { return '<button type="button" class="chip" data-v="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') + '</div>';
    else if (f.type === 'select') body = '<select><option value="">เลือก…</option>' + f.options.map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select>';
    else if (f.type === 'check') body = '<label class="check"><input type="checkbox"><span>' + esc(f.checkLabel || 'Yes') + '</span></label>';
    else if (f.type === 'textarea') body = '<textarea placeholder="' + esc(f.placeholder || '') + '"></textarea>';
    else body = '<input type="text"' + (f.type === 'name' ? ' list="staff" name="name" autocomplete="name" enterkeyhint="done"' : ' autocomplete="off"') + ' placeholder="' + esc(f.placeholder || '') + '">';
    return '<div class="q" data-k="' + esc(f.key) + '" hidden>' + lab + body + '</div>';
  }).join('');
  function box(k) { return document.querySelector('.q[data-k="' + k + '"]'); }
  function paint() {      /* values -> controls */
    CFG.fields.forEach(function (f) { var b = box(f.key), v = V[f.key] || '';
      if (f.type === 'chips') [].forEach.call(b.querySelectorAll('.chip'), function (c) { c.classList.toggle('on', c.getAttribute('data-v') === v); });
      else if (f.type === 'check') { var cb = b.querySelector('input'); cb.checked = !!v; b.querySelector('.check').classList.toggle('on', !!v); }
      else { var el = b.querySelector('select,textarea,input'); if (el.value !== v) el.value = v; } });
    show(); remember();
  }
  /* who you are is kept on this phone as you fill it in */
  function remember() { var keep = {}; Object.keys(V).forEach(function (k) { if (!NOKEEP[k] && V[k]) keep[k] = V[k]; });
    try { localStorage.setItem(KEEP, JSON.stringify(keep)); } catch (e) {} }
  function shown() { var on = {};
    CFG.fields.forEach(function (f) { on[f.key] = !(f.showIf || []).some(function (c) { return !on[c.f] || (c.in || []).indexOf(V[c.f]) < 0; }); });
    return on; }
  function show() { var on = shown(); CFG.fields.forEach(function (f) { box(f.key).hidden = !on[f.key]; }); }
  $('qs').addEventListener('click', function (e) {
    var c = e.target.closest('.chip'); if (!c) return; var q = c.closest('.q');
    V[q.getAttribute('data-k')] = c.getAttribute('data-v'); q.classList.remove('bad'); $('err').textContent = ''; paint();
  });
  $('qs').addEventListener('input', function (e) { var q = e.target.closest('.q'); if (!q) return; var k = q.getAttribute('data-k');
    V[k] = e.target.type === 'checkbox' ? (e.target.checked ? '1' : '') : e.target.value; q.classList.remove('bad'); $('err').textContent = ''; paint(); });
  $('qs').addEventListener('change', function (e) { var q = e.target.closest('.q'); if (!q) return; var k = q.getAttribute('data-k');
    V[k] = e.target.type === 'checkbox' ? (e.target.checked ? '1' : '') : e.target.value; paint(); });
  paint();

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var on = shown(), data = {}, miss = null;
    CFG.fields.forEach(function (f) { data[f.key] = on[f.key] ? (V[f.key] || '') : '';
      if (on[f.key] && f.required && !String(data[f.key]).trim() && !miss) miss = f; });
    if (miss) { var q = box(miss.key); q.classList.add('bad'); q.scrollIntoView({ behavior: 'smooth', block: 'center' });
      $('err').textContent = (miss.type === 'name' || miss.type === 'text' || miss.type === 'textarea' ? 'กรุณากรอก ' : miss.type === 'check' ? 'กรุณาติ๊ก ' : 'กรุณาเลือก ') + miss.label; return; }
    $('go').disabled = true; $('go').textContent = 'กำลังลงชื่อ…'; $('err').textContent = '';
    post(data).then(function (r) {
      $('go').disabled = false; $('go').textContent = 'ลงชื่อ';
      if (!r || !r.ok) { $('err').textContent = (r && r.error) || 'ลงชื่อไม่สำเร็จ ลองอีกครั้ง'; return; }
      try { var keep = {}; Object.keys(V).forEach(function (k) { if (!NOKEEP[k]) keep[k] = V[k]; }); localStorage.setItem(KEEP, JSON.stringify(keep)); } catch (e) {}
      $('dn').textContent = r.already ? 'ลงชื่อไว้แล้ว' : 'ขอบคุณ ' + r.name;
      $('dmsg').textContent = (r.already ? r.name + ' ลงชื่อ ' : 'ลงชื่อ ') + (r.group || '') + ' ' + dateText + (r.already ? ' ไว้แล้ว' : ' เรียบร้อย');
      $('dnum').innerHTML = 'ลงชื่อแล้ว <b>' + r.count + '</b> คน';
      $('dwho').textContent = 'ผู้เข้าประชุม' + (r.group ? ' ' + r.group : '') + ' วันนี้';
      $('dlist').innerHTML = r.names.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('');
      remember();
      $('form').hidden = true; $('done').hidden = false; window.scrollTo(0, 0);
    }).catch(function () {
      $('go').disabled = false; $('go').textContent = 'ลงชื่อ';
      $('err').textContent = 'เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง';
    });
  });
  $('again').addEventListener('click', function () {
    V = {}; try { localStorage.removeItem(KEEP); } catch (e) {}
    [].forEach.call(document.querySelectorAll('#qs .bad'), function (q) { q.classList.remove('bad'); });
    paint(); $('done').hidden = true; $('form').hidden = false; window.scrollTo(0, 0);
  });
  }
</script>
</body>
</html>
